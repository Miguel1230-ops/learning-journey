<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Práctica CSS Grid</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f0f0f0;
                padding: 20px;
                margin: 0;
            }

            /* 1. EL CONTENEDOR GRID: 3 columnas por defecto */
            .galeria {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 15px; /* Espacio limpio entre tarjetas */
            }

            /* 2. Tarjetas individuales */
            .tarjeta-grid {
                background-color: white;
                border: 2px solid #1a1a2e;
                border-radius: 10px;
                padding: 30px;
                text-align: center;
                font-size: 18px;
                font-weight: bold;
                box-shadow: 4px 4px 0 #1a1a2e;

            }

            /* 3. EN CELULARES (Menos de 600px): pasa automáticamente a 1 columna */
            @media (max-width: 600px) {
                .galeria {
                    grid-template-columns: 1fr; /* 1 sola fracción que ocupa todo */
                }
            }
            
            
        </style>
    </head>
    <body>

        <h1> Galería con CSS Grid</h1>
        <div class="galeria">
            <div class="tarjeta-grid">Caja 1</div>
            <div class="tarjeta-grid">Caja 2</div>
            <div class="tarjeta-grid">Caja 3</div>
            <div class="tarjeta-grid">Caja 4</div>
            <div class="tarjeta-grid">Caja 5</div>
            <div class="tarjeta-grid">Caja 6</div>
        </div>
        
    </body>
</html>
