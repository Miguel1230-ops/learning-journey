<!DOCTYPE html>
<html>
    <head>
        <style>
            /* 1. La tarjeta es el papa (el mapa de referencia) */
            .tarjeta {
                 /* el ancla! */
                width: 260px;
                padding: 20px;
                background-color: white;
                border: 3px solid #1a1a2e;
                border-radius: 12px;
                box-shadow: 6px 6px 0 #1a1a2e;
                margin: 50px;
                font-family: Arial, sans-serif;

            }

            /* 2. La insignia flotante (la pegatina) */
            .insignia {
                position: absolute; /* Despegado del suelo! */
                top: -12px;
                right: -12px;
                background-color: #ff4757;
                color: white;
                padding: 6px 12px;
                border: 2px solid #1a1a2e;
                border-radius: 20px;
                font-size: 12px;
                font-weight: bold;

            }
        </style>
    </head>
    <body>
        <div class="tarjeta";>
        <span class="insignia">Nuevo 🔥</span>
        <h3>Servicio de IA</h3>
        <p>Automatizamos la atencion al cliente para tu negocio local en Nicaragua</p>
    </div>

    </body>
</html>
